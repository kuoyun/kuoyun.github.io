<!DOCTYPE html>
<html lang="{{ site.lang | default: 'zh-TW' }}">
<head>
{% include head.html %}
</head>
<body class="wp-theme-hello-elementor elementor-default elementor-kit-23 elementor-page{% assign wpid = page.wp_id | default: page.id %}{% if wpid %} elementor-page-{{ wpid }}{% endif %}{% if page.url == '/' %} home{% endif %}">
{% include header.html %}
<main id="content" class="site-main{% if wpid %} post-{{ wpid }}{% endif %}">

{{ content }}
</div>
</main>
{% include footer.html %}
<script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
