{%- include context.html -%}
<!doctype html>
<html lang="{{ t.html_lang }}" class="no-js">
<head>
{% include head.html %}
</head>
<body id="top" class="layout-{{ page.layout | default: 'page' }}{% if page.hero_dark %} has-dark-hero{% endif %}">
<a class="skip-link" href="#main">{{ t.skip }}</a>
{% include header.html %}
<main id="main" tabindex="-1">
{{ content }}
</main>
{%- unless page.hide_cta %}
{% include cta.html %}
{%- endunless %}
{% include footer.html %}
<script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
